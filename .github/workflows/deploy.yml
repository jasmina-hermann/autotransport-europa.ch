# Lädt die Webseite bei jedem Push auf "main" automatisch per FTP zu Hostpoint hoch.
# Benötigte GitHub-Secrets (Repo > Settings > Secrets and variables > Actions):
#   FTP_SERVER   z. B. sl123.web.hostpoint.ch  (steht im Hostpoint Control Panel)
#   FTP_USERNAME FTP-Benutzer aus dem Hostpoint Control Panel
#   FTP_PASSWORD Passwort dieses FTP-Benutzers
name: Deploy zu Hostpoint

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - name: Hinweis falls FTP-Zugang fehlt
        if: env.HAS_FTP != 'true'
        run: echo "FTP-Secrets noch nicht hinterlegt, Upload wird uebersprungen."
      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'
      - name: FTP-Upload
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./www/autotransport-europa.ch/   # Pfad im Hostpoint-Webspace ggf. anpassen
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
